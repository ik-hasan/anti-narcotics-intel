services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: narcograph-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./ops/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    restart: unless-stopped
